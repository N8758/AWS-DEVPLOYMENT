services:

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: laundry-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: laundry-backend
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      DB_HOST: host.docker.internal